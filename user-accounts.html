<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>使用者帳號管理</title>
    <link rel="stylesheet" href="styles.css?v=20260617-0145" />
    <link rel="stylesheet" href="user-accounts.css" />
  </head>
  <body class="theme-user-accounts">
    <header class="app-header">
      <div><h1>使用者帳號管理</h1><p>管理 Admin / Viewer 帳號與密碼。</p></div>
      <div class="header-actions">
        <a class="secondary-link" href="index.html">Dashboard</a>
        <a class="secondary-link" href="students.html">學生管理</a>
        <a class="secondary-link admin-only" href="score-items.html">獎懲項目異動</a>
        <a class="secondary-link" href="score-transactions.html">點數異動</a>
        <a class="secondary-link" href="score-details-report.html">點數明細報表</a>
        <a class="secondary-link" href="audit-logs.html">異動紀錄</a>
      </div>
    </header>
    <main class="accounts-page admin-only">
      <section class="toolbar"><div><h2>帳號清單</h2><p id="accountCount" class="meta">載入中...</p></div><button id="addAccountButton" type="button">新增帳號</button></section>
      <div class="utility-row"><input id="accountSearch" class="table-search" type="search" placeholder="搜尋帳號、姓名或角色" /><div id="accountPagination" class="pagination"></div></div>
      <section class="table-wrap" aria-live="polite">
        <table class="account-table"><thead><tr><th>帳號</th><th>姓名</th><th>角色</th><th>最後異動時間</th><th>操作</th></tr></thead><tbody id="accountTableBody"></tbody></table>
        <div id="emptyAccounts" class="empty-state hidden">目前沒有帳號資料</div>
      </section>
    </main>
    <section class="accounts-page viewer-only"><div class="empty-state">請切換為 Admin 後再管理帳號。</div></section>
    <dialog id="accountDialog" class="modal">
      <form id="accountForm" method="dialog" class="entry-form modal-form">
        <div class="modal-title"><h2 id="accountFormTitle">新增帳號</h2><button id="closeAccountDialog" class="secondary-button icon-button" type="button" aria-label="關閉">×</button></div>
        <input id="accountId" type="hidden" />
        <label>帳號<input id="account" type="text" required maxlength="80" /></label>
        <label>姓名<input id="name" type="text" required maxlength="80" /></label>
        <label>角色<select id="role" required><option value="ADMIN">Admin</option><option value="VIEWER">Viewer</option></select></label>
        <label>密碼 / 修改密碼<input id="password" type="password" minlength="1" autocomplete="new-password" /><span class="meta">新增帳號時必填；編輯時若不修改密碼可留空。</span></label>
        <p id="formError" class="error-text hidden"></p>
        <div class="form-actions"><button type="submit">儲存</button><button id="cancelAccountForm" class="secondary-button" type="button">取消</button></div>
      </form>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="api-client.js?v=20260617-0045"></script>
    <script src="auth.js"></script>
    <script src="ui-utils.js"></script>
    <script src="user-accounts.js?v=20260617-0145"></script>
  </body>
</html>
