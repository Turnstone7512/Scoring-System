<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>點數明細報表</title>
    <link rel="stylesheet" href="styles.css?v=20260824-0020" />
    <link rel="stylesheet" href="score-details-report.css?v=20260617-0145" />
  </head>
  <body class="theme-reports">
    <header class="app-header">
      <div><h1>點數明細報表</h1><p>依學生、日期、類型與項目查詢點數異動明細。</p></div>
      <div class="header-actions">
        <a class="secondary-link" href="index.html">Dashboard</a>
        <a class="secondary-link" href="score-transactions.html">點數異動</a>
        <a class="secondary-link admin-only" href="score-items.html">獎懲項目異動</a>
        <a class="secondary-link" href="students.html">學生管理</a>
        <a class="secondary-link" href="audit-logs.html">異動紀錄</a>
        <a class="secondary-link" href="student-measurements.html">身高體重</a>
      </div>
    </header>
    <main class="report-page">
      <section class="report-panel">
        <div class="section-title"><div><h2>查詢條件</h2><p class="meta">項目可使用 Ctrl 或 Shift 多選。</p></div></div>
        <form id="reportSearchForm" class="report-search-grid">
          <label>學生<select id="studentId"><option value="">全部學生</option></select></label>
          <label>開始日期<input id="dateFrom" type="date" /></label>
          <label>結束日期<input id="dateTo" type="date" /></label>
          <label>類型<select id="type"><option value="">全部</option><option value="REWARD">獎勵</option><option value="PENALTY">懲罰</option><option value="REDEEM">兌換獎品</option><option value="SETTLEMENT">結餘</option></select></label>
          <label class="wide-field">項目<select id="scoreItemIds" multiple size="6"></select></label>
          <div class="form-actions align-end"><button type="submit">查詢</button><button id="clearButton" class="secondary-button" type="button">清除條件</button></div>
        </form>
      </section>
      <section class="report-panel">
        <div class="section-title"><div><h2>報表結果</h2><p id="resultCount" class="meta">載入中...</p></div></div>
        <div class="table-wrap" aria-live="polite">
          <table class="report-table"><thead><tr><th>學生</th><th>日期</th><th>類型</th><th>項目</th><th>異動點數</th><th>結餘點數</th></tr></thead><tbody id="reportTableBody"></tbody></table>
          <div id="emptyReport" class="empty-state hidden">沒有符合條件的資料</div>
        </div>
      </section>
      <div class="page-version">20260824-0020</div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=20260824-0020"></script>
    <script src="api-client.js?v=20260824-0020"></script>
    <script src="auth.js?v=20260824-0020"></script>
    <script src="ui-utils.js"></script>
    <script src="score-details-report.js?v=20260617-0145"></script>
  </body>
</html>
