<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>頁面轉址中</title>
    <script>
      const routes = {
        "/": "index.html",
        "/students": "students.html",
        "/score-items": "score-items.html",
        "/score-transactions": "score-transactions.html",
        "/reports/score-details": "score-details-report.html",
        "/audit-logs": "audit-logs.html",
      };
      const target = routes[window.location.pathname];
      if (target) {
        window.location.replace(`${target}${window.location.search}${window.location.hash}`);
      }
    </script>
  </head>
  <body>
    <p>頁面轉址中，若未自動轉址，請回到 <a href="index.html">Dashboard</a>。</p>
  </body>
</html>
