<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>計點系統 Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body class="theme-dashboard">
    <header class="app-header">
      <div>
        <h1>計點系統 Dashboard</h1>
        <p>查看所有學生目前分數與最後異動狀態。</p>
      </div>
      <div class="header-actions">
        <a class="secondary-link" href="/score-transactions">分數異動</a>
        <a class="secondary-link" href="/reports/score-details">分數明細報表</a>
        <a class="secondary-link" href="/score-items">加減分項目</a>
        <a class="secondary-link" href="/students">學生管理</a>
      </div>
    </header>

    <main class="dashboard-page">
      <section class="summary-grid">
        <article class="summary-card">
          <span class="meta">學生人數</span>
          <strong id="studentTotal">0</strong>
        </article>
        <article class="summary-card">
          <span class="meta">總分合計</span>
          <strong id="scoreTotal">0</strong>
        </article>
        <article class="summary-card">
          <span class="meta">最高分</span>
          <strong id="highestScore">0</strong>
        </article>
      </section>

      <section class="dashboard-panel">
        <div class="section-title">
          <div>
            <h2>學生分數總覽</h2>
            <p id="sortStatus" class="meta">預設依班級座號排序</p>
          </div>
        </div>

        <div class="table-wrap" aria-live="polite">
          <table class="dashboard-table">
            <thead>
              <tr>
                <th>
                  <button class="sort-button" type="button" data-sort="name">學生姓名 <span data-indicator="name"></span></button>
                </th>
                <th>
                  <button class="sort-button" type="button" data-sort="classNo">班級座號 <span data-indicator="classNo"></span></button>
                </th>
                <th>
                  <button class="sort-button" type="button" data-sort="currentScore">目前分數 <span data-indicator="currentScore"></span></button>
                </th>
                <th>
                  <button class="sort-button" type="button" data-sort="lastTransactionAt">最後異動日 <span data-indicator="lastTransactionAt"></span></button>
                </th>
              </tr>
            </thead>
            <tbody id="dashboardTableBody"></tbody>
          </table>
          <div id="emptyDashboard" class="empty-state hidden">目前沒有學生資料</div>
        </div>
      </section>
    </main>

    <script src="dashboard.js"></script>
  </body>
</html>
