<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>學生管理</title>
    <link rel="stylesheet" href="styles.css?v=20260721-0080" />
    <link rel="stylesheet" href="students.css" />
  </head>
  <body class="theme-students">
    <header class="app-header">
      <div><h1>學生管理</h1><p>新增、編輯與刪除學生資料，並查看目前點數與最後異動時間。</p></div>
      <div class="header-actions">
        <a class="secondary-link" href="index.html">Dashboard</a>
        <a class="secondary-link admin-only" href="score-items.html">獎懲項目異動</a>
        <a class="secondary-link" href="score-transactions.html">點數異動</a>
        <a class="secondary-link" href="score-details-report.html">點數明細報表</a>
        <a class="secondary-link" href="audit-logs.html">異動紀錄</a>
        <a class="secondary-link" href="student-measurements.html">身高體重</a>
      </div>
    </header>
    <main class="students-page">
      <section class="toolbar"><div><h2>學生清單</h2><p id="studentCount" class="meta">載入中...</p></div><button id="addStudentButton" type="button">新增學生</button></section>
      <section class="table-wrap" aria-live="polite">
        <table class="student-table">
          <thead><tr><th>學生姓名</th><th>性別</th><th>出生年</th><th>年級</th><th>座號</th><th>Email</th><th>目前點數</th><th>最後異動時間</th><th>操作</th></tr></thead>
          <tbody id="studentsTableBody"></tbody>
        </table>
        <div id="emptyStudents" class="empty-state hidden">目前沒有學生資料</div>
      </section>
      <div class="page-version">20260721-0080</div>
    </main>
    <dialog id="studentDialog" class="modal">
      <form id="studentForm" method="dialog" class="entry-form modal-form">
        <div class="modal-title"><h2 id="studentFormTitle">新增學生</h2><button id="closeStudentDialog" class="secondary-button icon-button" type="button" aria-label="關閉">×</button></div>
        <input id="studentId" type="hidden" />
        <label>學生姓名<input id="name" name="name" type="text" required maxlength="80" /></label>
        <label>性別<select id="gender" name="gender"><option value="">未註記</option><option value="FEMALE">女</option><option value="MALE">男</option></select></label>
        <label>出生年<input id="birthYear" name="birthYear" type="number" min="1900" max="2100" step="1" placeholder="例如：2017" /></label>
        <label>年級<input id="grade" name="grade" type="number" min="1" max="9" step="1" required /></label>
        <label>座號<input id="classNo" name="classNo" type="text" maxlength="30" placeholder="例如 12" /></label>
        <label>Email<input id="email" name="email" type="email" maxlength="120" /></label>
        <label>照片網址<input id="photoUrl" name="photoUrl" type="url" placeholder="https://example.com/photo.jpg" /></label>
        <p id="formError" class="error-text hidden"></p>
        <div class="form-actions"><button type="submit">儲存</button><button id="cancelStudentForm" class="secondary-button" type="button">取消</button></div>
      </form>
    </dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=20260721-0080"></script>
    <script src="api-client.js?v=20260721-0080"></script>
    <script src="auth.js?v=20260721-0080"></script>
    <script src="ui-utils.js"></script>
    <script src="students.js?v=20260630-0050"></script>
  </body>
</html>
