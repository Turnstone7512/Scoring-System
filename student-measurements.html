<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>身高體重</title>
    <link rel="stylesheet" href="styles.css?v=20260629-0020" />
    <link rel="stylesheet" href="student-measurements.css?v=20260720-0020" />
  </head>
  <body class="theme-measurements">
    <header class="app-header">
      <div>
        <h1>身高體重</h1>
        <p>記錄與查看身高、體重變化。</p>
      </div>
      <div class="header-actions">
        <a class="secondary-link" href="index.html">Dashboard</a>
        <a class="secondary-link" href="score-transactions.html">點數異動</a>
        <a class="secondary-link" href="score-details-report.html">點數明細報表</a>
        <a class="secondary-link" href="audit-logs.html">異動紀錄</a>
        <a class="secondary-link admin-only" href="score-items.html">獎懲項目異動</a>
        <a class="secondary-link" href="students.html">學生管理</a>
        <a class="secondary-link" href="student-measurements.html">身高體重</a>
      </div>
    </header>
    <main class="measurements-page">
      <section class="measurements-panel">
        <div class="section-title">
          <div>
            <h2 id="measurementFormTitle">新增身高體重</h2>
            <p class="meta">身高、體重、腰圍與量測地點可留空，日期與 Name 必填。</p>
          </div>
        </div>
        <form id="measurementForm" class="measurement-form">
          <input id="measurementId" type="hidden" />
          <label>日期<input id="measurementDate" type="date" min="1900-01-01" max="2100-12-31" required /></label>
          <label>Name<select id="formStudentId" required></select></label>
          <label>量測地點<select id="locationSelect"></select></label>
          <label>自行輸入地點<input id="locationInput" type="text" maxlength="80" placeholder="例如：保健室" /></label>
          <label id="heightField">身高（cm）<input id="heightCm" type="number" min="0" max="300" step="0.1" /></label>
          <label id="weightField">體重（kg）<input id="weightKg" type="number" min="0" max="300" step="0.1" /></label>
          <label id="waistField">腰圍（cm）<input id="waistCm" type="number" min="0" max="300" step="0.1" /></label>
          <label class="wide-field">備註<input id="note" type="text" maxlength="200" /></label>
          <p id="measurementFormError" class="error-text hidden"></p>
          <div class="form-actions">
            <button type="submit">儲存</button>
            <button id="cancelMeasurementEdit" class="secondary-button hidden" type="button">取消編輯</button>
          </div>
        </form>
      </section>

      <section class="measurements-panel">
        <div class="section-title">
          <div>
            <h2>身高體重折線圖</h2>
            <p class="meta">選擇學生後直接顯示該學生的身高與體重趨勢。</p>
          </div>
          <div class="filter-controls">
            <label class="inline-select">Name<select id="chartStudentId"></select></label>
            <label class="inline-select">量測地點<select id="chartLocationFilter"></select></label>
          </div>
        </div>
        <div id="measurementChart" class="measurement-chart" aria-live="polite"></div>
        <div class="chart-actions">
          <button id="downloadCharts" class="secondary-button" type="button">下載圖檔</button>
        </div>
      </section>

      <section class="measurements-panel">
        <div class="section-title">
          <div>
            <h2>身高體重明細</h2>
            <p id="measurementCount" class="meta">載入中...</p>
          </div>
          <div class="filter-controls">
            <label class="inline-select">Name<select id="detailStudentId"></select></label>
            <label class="inline-select">量測地點<select id="detailLocationFilter"></select></label>
          </div>
        </div>
        <div class="table-wrap" aria-live="polite">
          <div id="detailSuggestion" class="detail-suggestion"></div>
          <table class="measurement-table">
            <thead>
              <tr id="measurementTableHead">
              </tr>
            </thead>
            <tbody id="measurementTableBody"></tbody>
          </table>
          <div id="emptyMeasurements" class="empty-state hidden">目前沒有身高體重紀錄</div>
        </div>
      </section>
      <section class="measurements-panel">
        <div class="section-title">
          <div>
            <h2>臨時計算 PR 值</h2>
            <p class="meta">僅儲存於此瀏覽器快取，不會寫入資料庫。</p>
          </div>
        </div>
        <form id="temporaryPrForm" class="measurement-form temporary-pr-form">
          <label>Name<input id="temporaryPrName" type="text" maxlength="80" /></label>
          <label>出生年<input id="temporaryPrBirthYear" type="number" min="1900" max="2100" /></label>
          <label>性別<select id="temporaryPrGender"><option value="">請選擇</option><option value="MALE">男</option><option value="FEMALE">女</option></select></label>
          <label class="temporary-pr-height-field">身高（cm）<input id="temporaryPrHeight" type="number" min="0" max="300" step="0.1" /></label>
          <label class="temporary-pr-weight-field">體重（kg）<input id="temporaryPrWeight" type="number" min="0" max="300" step="0.1" /></label>
          <p id="temporaryPrError" class="error-text hidden"></p>
          <div class="form-actions">
            <button type="submit">計算</button>
            <button id="clearTemporaryPr" class="secondary-button" type="button">清除</button>
          </div>
        </form>
        <div id="temporaryPrResult" class="temporary-pr-result empty-state">尚未計算</div>
      </section>
      <div class="page-version">20260720-0030</div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=20260720-0020"></script>
    <script src="api-client.js?v=20260630-0180"></script>
    <script src="auth.js?v=20260720-0030"></script>
    <script src="ui-utils.js"></script>
    <script src="student-measurements.js?v=20260720-0020"></script>
  </body>
</html>
